# Environment for the GitHub Actions runner: Snakemake (which builds the
# per-rule envs in envs/) plus R + data.table for the mock QTLtools.
name: ci
channels: [conda-forge, bioconda, nodefaults]
dependencies:
  - python=3.11
  - snakemake-minimal>=8,<9
  - pandas
  - conda>=24.7.1
  - r-base>=4.4.3
  - r-data.table
