# Build the QTLtools container image and publish it to the GitHub Container
# Registry (manual trigger only).
name: QTLtools container

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/qtltools/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qtltools:1.3.1
