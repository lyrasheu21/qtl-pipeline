# Toy test: CCI adapter (sending + receiving sets), full downstream.
#   snakemake --profile profiles/local --configfile tests/configs/cci.yaml [tests/configs/mock.yaml]
# Toy data: tests/data (regenerate with `Rscript tests/data/generate_toy_data.R`).

results_dir: "results_test/cci"

modules:
  coloc: true
  magma: false          # needs the MAGMA binary and real gene-level GWAS results
  pi1: true
  expression_cor: true
  sensitivity: true

inputs:
  gene_annotation: "tests/data/gene_annotation.tsv"
  group_table: "tests/data/cell_types.tsv"
  metadata: "tests/data/metadata.tsv"
  metadata_id_column: "SubID"
  expression_pattern: "tests/data/expression/{group}.tsv.gz"
  gwas_table: "tests/data/gwas.tsv"

chromosomes: [1, 2]

genotypes:
  vcf: "tests/data/genotypes.vcf.gz"
  keep: "tests/data/keep.txt"
  pcs:
    source: "file"
    file: "tests/data/ancestry_pcs.tsv"

phenotypes:
  cci:
    adapter: cci
    matrix: "tests/data/cci_matrix.tsv.gz"
    id_column: "cci"
    min_nonzero_fraction: 0.0
    zero_as_missing: false
    fdr_group_by: group

covariates:
  metadata:
    definitions:
      scaled_PMI:       {column: PMI, transform: scale}
      scaled_Age:       {column: Age, transform: scale}
      Sex:              {column: Sex, transform: factor}
      prep:             {column: prep, transform: factor}
      Brain_bank:       {column: Brain_bank, transform: factor}
      log_avg_n_counts: {column: avg_n_counts, transform: log}
      global_PC1:       {column: PC1, transform: none}
    use: [scaled_PMI, scaled_Age, Sex, prep, Brain_bank, log_avg_n_counts]
  genotype_pcs: 3
  min_donors: 30

qtl:
  n_chunks: 2
  n_permutations: 100
  window: 1000000
  seed: 42

qtl_qc:
  fdr: 0.05
  nominal_sample_fraction: 0.5

sensitivity:
  n_permutations: 100
  min_nonzero_fraction: [0.97]
  donor_fraction: [0.9]
  covariate_sets:
    with_global_PC1: [scaled_PMI, scaled_Age, Sex, prep, Brain_bank, log_avg_n_counts, global_PC1]

coloc:
  max_locus_plots: 5


pi1:
  eqtl_pattern: "tests/data/eqtl/eqtl_{group}_chr{chr}.tsv.gz"

