# R environment for every analysis and figure script
channels: [conda-forge, bioconda, nodefaults]
dependencies:
  - r-base>=4.4.3
  - r-data.table
  - r-r.utils
  - r-arrow
  - r-ggplot2
  - r-patchwork
  - r-upsetr
  - r-coloc
  - r-testthat
  - r-knitr
  - r-rmarkdown
  - pandoc
  - bioconductor-qvalue
  - bioconductor-limma
