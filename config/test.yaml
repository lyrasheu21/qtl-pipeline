# Test configuration: runs the whole pipeline on the synthetic toy dataset in
# tests/data (regenerate with `Rscript tests/data/generate_toy_data.R`).
#
#   snakemake --profile profiles/local --configfile config/test.yaml
#
# Values not set here come from config/config.yaml.

results_dir: "results_test"

modules:
  coloc: true
  magma: false          # needs the MAGMA binary and real gene-level GWAS results
  pi1: true
  mediation: true
  expression_cor: true
  sensitivity: true

inputs:
  genotype:
    bfile: ""
    vcf: "tests/data/genotypes.vcf.gz"
    keep: "tests/data/keep.txt"
    update_ids: ""
  cci_matrix: "tests/data/cci_matrix.tsv.gz"
  cci_id_column: "cci"
  gene_annotation: "tests/data/gene_annotation.tsv"
  metadata: "tests/data/metadata.tsv"
  metadata_id_column: "SubID"
  ancestry_pcs: "tests/data/ancestry_pcs.tsv"
  ancestry_pcs_id_column: "SubID"
  expression_pattern: "tests/data/expression/{subclass}.tsv.gz"
  cell_types: "tests/data/cell_types.tsv"
  gwas_table: "tests/data/gwas.tsv"

chromosomes: [1, 2]

phenotype:
  min_completeness: 0.0
  zero_as_missing: false
  min_donors: 30

covariates:
  n_ancestry_pcs: 3

qtl:
  n_chunks: 2
  n_permutations: 100
  nominal_threshold: 1
  window: 1000000
  seed: 42

qtl_qc:
  fdr: 0.05
  nominal_sample_fraction: 0.5
  seed: 42

sensitivity:
  n_permutations: 100
  completeness: [0.97]
  donor_fraction: [0.9]
  covariate_sets:
    with_global_PC1: [scaled_PMI, scaled_Age, Sex, prep, Brain_bank, log_avg_n_counts, global_PC1]
  seed: 42

coloc:
  max_locus_plots: 5

mediation:
  snp_pp_h4: 0.5
  pp_h4: 0.8
  gwas_p: 5.0e-8
  qtl_p: 1.0e-4         # relaxed: 58 toy donors cannot reach 5e-8
  sims: 200
  seed: 42

pi1:
  eqtl_pattern: "tests/data/eqtl/eqtl_{subclass}_chr{chr}.tsv.gz"

figures:
  chord_targets: ["Astro:LIGA", "OPC:RECB"]
