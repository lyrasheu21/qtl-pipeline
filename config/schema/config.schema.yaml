$schema: "https://json-schema.org/draft/2020-12/schema"
description: QTL pipeline configuration
type: object

definitions:
  probability: {type: number, minimum: 0, maximum: 1}
  sample_map:
    type: object
    properties:
      file: {type: string}
      from: {type: string}
      to: {type: string}

properties:
  results_dir: {type: string}

  modules:
    type: object
    properties:
      coloc: {type: boolean}
      magma: {type: boolean}
      pi1: {type: boolean}
      mediation: {type: boolean}
      expression_cor: {type: boolean}
      sensitivity: {type: boolean}

  inputs:
    type: object
    properties:
      gene_annotation: {type: string}
      group_table: {type: string}
      metadata: {type: string}
      metadata_id_column: {type: string}
      expression_pattern: {type: string}
      gwas_table: {type: string}

  chromosomes:
    type: array
    items: {type: [integer, string]}
    minItems: 1

  genotypes:
    type: object
    properties:
      bfile: {type: string}
      vcf: {type: string}
      keep: {type: string}
      update_ids: {type: string}
      qc:
        type: object
        properties:
          enabled: {type: boolean}
          geno: {$ref: "#/definitions/probability"}
          maf: {type: number, minimum: 0, maximum: 0.5}
          hwe: {$ref: "#/definitions/probability"}
          mishap_p: {$ref: "#/definitions/probability"}
        required: [enabled, geno, maf, hwe, mishap_p]
      pcs:
        type: object
        properties:
          source: {enum: [none, file, compute]}
          file: {type: string}
          n_compute: {type: integer, minimum: 1}
    required: [qc]

  phenotypes:
    type: object
    additionalProperties:
      type: object
      properties:
        adapter: {enum: [bed, matrix, cci]}
        bed: {type: string}
        matrix: {type: string}
        coordinates: {type: string}
        annotation: {type: string}
        id_column: {type: string}
        coordinates_id_column: {type: string}
        group: {type: string}
        min_nonzero_fraction: {$ref: "#/definitions/probability"}
        zero_as_missing: {type: boolean}
        fdr_group_by: {enum: [group, class, superclass, none]}
        fdr_method: {enum: [storey, bh]}
        grouped_permutation: {type: boolean}
        window: {type: integer, minimum: 1}
        sample_map: {$ref: "#/definitions/sample_map"}
      required: [adapter]

  covariates:
    type: object
    properties:
      metadata:
        type: object
        properties:
          definitions:
            type: object
            additionalProperties:
              type: object
              properties:
                column: {type: string}
                transform: {enum: [none, scale, log, factor]}
              required: [column, transform]
          use: {type: array, items: {type: string}}
      genotype_pcs: {type: integer, minimum: 0}
      hidden_factors:
        type: object
        properties:
          source: {enum: [none, file, phenotype_pca]}
          file: {type: string}
          object: {type: string}
          sample_map: {$ref: "#/definitions/sample_map"}
          k: {type: integer, minimum: 0}
      min_donors: {type: integer, minimum: 1}
    required: [metadata]

  qtl:
    type: object
    properties:
      qtltools_binary: {type: string}
      container: {type: string}
      n_chunks: {type: integer, minimum: 1}
      n_permutations: {type: integer, minimum: 1}
      nominal_threshold: {type: number, exclusiveMinimum: 0, maximum: 1}
      window: {type: integer, minimum: 1}
      seed: {type: integer}
    required: [n_chunks, n_permutations, nominal_threshold, window, seed]

  qtl_qc:
    type: object
    properties:
      fdr: {$ref: "#/definitions/probability"}
      nominal_sample_fraction: {$ref: "#/definitions/probability"}
      seed: {type: integer}
    required: [fdr, nominal_sample_fraction]

  sensitivity:
    type: object
    properties:
      n_permutations: {type: integer, minimum: 1}
      min_nonzero_fraction: {type: array, items: {$ref: "#/definitions/probability"}}
      donor_fraction: {type: array, items: {$ref: "#/definitions/probability"}}
      covariate_sets: {type: object, additionalProperties: {type: array, items: {type: string}}}
      sweep_k: {type: array, items: {type: integer, minimum: 0}}
      seed: {type: integer}

  coloc:
    type: object
    properties:
      p1: {type: number}
      p2: {type: number}
      p12: {type: number}
      min_snps: {type: integer, minimum: 1}
      pp_h4: {$ref: "#/definitions/probability"}
      snp_pp_h4: {$ref: "#/definitions/probability"}
      max_locus_plots: {type: integer, minimum: 0}

  magma:
    type: object
    properties:
      binary: {type: string}
      gene_id_column: {type: string}
      levels: {type: array, items: {enum: [group, class, superclass]}}
      nominal_p: {$ref: "#/definitions/probability"}
      gene_results: {type: object, additionalProperties: {type: string}}

  mediation:
    type: object
    properties:
      snp_pp_h4: {$ref: "#/definitions/probability"}
      pp_h4: {$ref: "#/definitions/probability"}
      gwas_p: {$ref: "#/definitions/probability"}
      qtl_p: {$ref: "#/definitions/probability"}
      sims: {type: integer, minimum: 1}
      seed: {type: integer}

required: [modules, genotypes, phenotypes, covariates, qtl, qtl_qc]
