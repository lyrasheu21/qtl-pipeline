# Cell-cell interaction QTLs (cci adapter): each CCI is mapped at its ligand
# gene (set cci_sending) and at its receptor gene (set cci_receiving), with
# q-values per anchor subclass. Replace the /path/to/ placeholders.
#
#   snakemake --profile profiles/lsf --configfile config/examples/cci.yaml

results_dir: "results/cci"

modules:
  coloc: true            # needs at least one GWAS row in config/gwas.tsv
  magma: true
  pi1: true
  expression_cor: true
  sensitivity: false

inputs:
  gene_annotation: "/path/to/gene_annotation.tsv"
  group_table: "config/cell_types.tsv"
  metadata: "/path/to/donor_metadata.csv"
  metadata_id_column: "SubID"
  expression_pattern: "/path/to/residuals/{group}.tsv.gz"
  gwas_table: "config/gwas.tsv"

genotypes:
  bfile: "/path/to/genotypes"             # plink prefix
  keep: "/path/to/eur_donors.txt"
  update_ids: "/path/to/update_ids.txt"
  qc:
    enabled: true
    geno: 0.05
    maf: 0.01
    hwe: 1.0e-6
    mishap_p: 1.0e-10
  pcs:
    source: "file"
    file: "/path/to/ancestry_pcs.tsv"

phenotypes:
  cci:
    adapter: cci
    matrix: "/path/to/cci_matrix.parquet"  # donors x CCI scores
    id_column: "cci"
    min_nonzero_fraction: 0.0
    zero_as_missing: false
    fdr_group_by: group

covariates:
  metadata:
    definitions:
      scaled_PMI:       {column: PMI, transform: scale}
      scaled_Age:       {column: Age, transform: scale}
      Sex:              {column: Sex, transform: factor}
      prep:             {column: prep, transform: factor}
      Brain_bank:       {column: Brain_bank, transform: factor}
      log_avg_n_counts: {column: avg_n_counts, transform: log}
      global_PC1:       {column: PC1, transform: none}
      global_PC2:       {column: PC2, transform: none}
      global_PC3:       {column: PC3, transform: none}
    use: [scaled_PMI, scaled_Age, Sex, prep, Brain_bank, log_avg_n_counts]
  genotype_pcs: 10

qtl:
  n_chunks: 22
  n_permutations: 1000

magma:
  binary: "/path/to/magma"
  gene_results:
    SCZ: "/path/to/SCZ.genes.raw"

pi1:
  eqtl_pattern: "/path/to/eqtl/eQTL_result_{group}_chr{chr}.gz"

